<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в ADROBOT — Keitaro Campaign Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-container {
      max-width: 440px;
      margin: 80px auto;
      padding: 32px;
      background: var(--bg-card, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .login-header {
      margin-bottom: 24px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary, #0f172a);
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-secondary, #64748b);
      line-height: 1.5;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary, #1e293b);
      margin-bottom: 6px;
    }

    .login-form input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color, #cbd5e1);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-form input[type="password"]:focus {
      border-color: var(--primary, #00A86B);
      box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.15);
    }

    .login-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary, #00A86B);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background: #008f5a;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-demo {
      width: 100%;
      padding: 11px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-demo:hover {
      background: #e2e8f0;
    }

    .login-alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }

    .login-alert.alert-error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .login-alert.alert-warning {
      display: block;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .login-explanation {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color, #e2e8f0);
      font-size: 12px;
      color: var(--text-secondary, #64748b);
      text-align: center;
      line-height: 1.5;
    }

    .countdown-timer {
      font-weight: 700;
      color: #b91c1c;
    }
  </style>
</head>

<body style="background: var(--bg-main, #f8fafc);">
  <div class="login-container" role="main">
    <div class="login-header">
      <h1>Вход в ADROBOT</h1>
      <p>Для работы с настоящим Keitaro нужен API-ключ.<br>Демо работает с тестовыми данными.</p>
    </div>

    <div id="loginAlert" class="login-alert" role="alert" aria-live="polite"></div>

    <form id="loginForm" class="login-form" autocomplete="off">
      <input type="hidden" id="returnToInput" name="return_to" value="{{ return_to }}">
      <div class="form-group">
        <label for="apiKeyInput">API-ключ Keitaro</label>
        <input type="password" id="apiKeyInput" name="api_key" placeholder="Введите ваш API-ключ..." required
          maxlength="1024" autofocus>
      </div>

      <div class="login-actions">
        <button type="submit" id="submitBtn" class="btn-submit">Войти в Keitaro</button>
        <button type="button" id="openDemoBtn" class="btn-demo">Открыть демо без ключа</button>
      </div>
    </form>

    <div class="login-explanation">
      URL настоящего трекера настроен на сервере.<br>
      API-ключ проверяется сервером и не сохраняется в браузере.
    </div>
  </div>

  <script src="/static/js/api_client.js"></script>
  <script src="/static/js/login.js"></script>
</body>

</html>
