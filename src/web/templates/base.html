<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Campaign Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="app-body">
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="brand-badge">KM</span>
          <span class="brand-title">Campaign Manager</span>
        </div>
        <button class="mobile-toggle" id="mobileMenuClose" aria-label="Закрыть меню">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <a href="/creator" class="nav-item {% if active_page == 'creator' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>Создание кампании</span>
        </a>
        <a href="/editor" class="nav-item {% if active_page == 'editor' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Редактор кампаний</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="env-info">
          <span class="env-label">Версия:</span>
          <span class="env-value">{{ version }}</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="mobileMenuOpen" aria-label="Открыть меню">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="page-title">{% block page_title %}Campaign Manager{% endblock %}</h1>
        </div>
        <div class="topbar-right">
          <div class="status-indicator" id="ktConnectionStatus">
            <span class="status-dot {% if keitaro_configured %}dot-configured{% else %}dot-unverified{% endif %}"></span>
            <span class="status-text">
              {% if keitaro_configured %}KT Настроен{% else %}KT Не проверено{% endif %}
            </span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script>
    // Responsive sidebar toggle
    const menuOpen = document.getElementById('mobileMenuOpen');
    const menuClose = document.getElementById('mobileMenuClose');
    const sidebar = document.getElementById('appSidebar');

    if (menuOpen && sidebar) {
      menuOpen.addEventListener('click', () => sidebar.classList.add('open'));
    }
    if (menuClose && sidebar) {
      menuClose.addEventListener('click', () => sidebar.classList.remove('open'));
    }

    // Global Toast Helper
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
  <script src="/static/js/tooltip.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
