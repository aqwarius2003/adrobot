services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: adrobot:latest
    container_name: adrobot-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - KT_MODE=real
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-secret-key-change-in-prod}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=sqlite:////app/data/app.db
      - REAL_DATABASE_URL=sqlite:////app/data/app.db
      - SECURITY_DATABASE_URL=sqlite:////app/data/security.db
      # Runtime secrets provided via local .env file or host environment
      - KEITARO_BASE_URL=${KEITARO_BASE_URL:-https://tracker.example}
      - REAL_KEITARO_BASE_URL=${REAL_KEITARO_BASE_URL:-${KEITARO_BASE_URL:-https://tracker.example}}
      - KEITARO_API_KEY=
      - REAL_KEITARO_API_KEY=
    volumes:
      - adrobot_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  adrobot_data:
    name: adrobot_persistent_data
