name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Test & Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.6.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify lockfile consistency and sync dependencies
        run: |
          uv sync --locked --group dev

      - name: Lint with Ruff
        run: |
          uv run --locked ruff check .

      - name: Check code formatting with Ruff
        run: |
          uv run --locked ruff format --check .

      - name: Test migrations on clean temporary database
        env:
          DATABASE_URL: sqlite:////tmp/ci_test.db
        run: |
          uv run --locked alembic upgrade head

      - name: Run unit & API tests
        env:
          DATABASE_URL: sqlite:///:memory:
          APP_ENV: testing
        run: |
          uv run --locked pytest -v

  docker-build-and-smoke:
    name: Docker Build & Runner Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          load: true
          tags: adrobot:${{ github.sha }}

      - name: Smoke test container /api/health on runner
        run: |
          docker run -d --name runner-smoke-app -p 8000:8000 \
            -e APP_ENV=production \
            -e COMMIT_SHA=${{ github.sha }} \
            adrobot:${{ github.sha }}

          sleep 5

          HEALTH_JSON=$(curl -fsS http://localhost:8000/api/health)
          echo "Smoke Health Response: $HEALTH_JSON"

          echo "$HEALTH_JSON" | grep -q '"status":"ok"' || (echo "Health check failed!" && exit 1)
          echo "$HEALTH_JSON" | grep -q '"database":"connected"' || (echo "DB check failed!" && exit 1)

          docker stop runner-smoke-app
          docker rm runner-smoke-app
