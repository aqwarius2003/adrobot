name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Test & Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.6.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify lockfile consistency and sync dependencies
        run: |
          uv sync --locked --group dev

      - name: Lint with Ruff
        run: |
          uv run --locked ruff check .

      - name: Check code formatting with Ruff
        run: |
          uv run --locked ruff format --check .

      - name: Test migrations on clean temporary database
        env:
          DATABASE_URL: "sqlite:////tmp/ci_test.db"
          REAL_DATABASE_URL: "sqlite:////tmp/ci_test.db"
        run: |
          uv run --locked alembic upgrade head

      - name: Run unit & API tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: testing
        run: |
          uv run --locked pytest -v

      - name: Validate client JavaScript syntax
        run: |
          for file in src/web/static/js/*.js; do
            node --check "$file" || exit 1
          done

      - name: Run frontend unit tests
        run: |
          node tests/test_frontend_api_client.js
          node tests/test_frontend_geo.js
          node tests/test_frontend_combobox.js
          node tests/test_frontend_campaign_picker.js
          node tests/test_frontend_errors.js
          node tests/test_frontend_login.js
          node tests/test_frontend_simulator.js
          node tests/test_frontend_view_in_kt.js
          node tests/test_frontend_weight_controls.js
          node tests/test_frontend_creator_result.js

  docker-build-and-smoke:
    name: Docker Build & Runner Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          load: true
          tags: adrobot:${{ github.sha }}

      - name: Smoke test container /api/health on runner
        run: |
          trap 'docker logs runner-smoke-app; docker rm -f runner-smoke-app >/dev/null 2>&1 || true' EXIT
          docker run -d --name runner-smoke-app -p 8000:8000 \
            -e APP_ENV=production \
            -e COMMIT_SHA=${{ github.sha }} \
            adrobot:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > runner-health.json; then
              break
            fi
            sleep 1
          done

          HEALTH_JSON=$(cat runner-health.json)
          echo "Smoke Health Response: $HEALTH_JSON"

          echo "$HEALTH_JSON" | grep -q '"status":"ok"' || (echo "Health check failed!" && exit 1)
          echo "$HEALTH_JSON" | grep -q '"database":"connected"' || (echo "DB check failed!" && exit 1)

          docker logs runner-smoke-app > runner-startup.log 2>&1
          if grep -Ei 'demo|simulator|симулятор' runner-startup.log; then
            echo "Unexpected optional component in startup logs"
            exit 1
          fi

          docker exec -i runner-smoke-app python - <<'PY'
          import json
          import sqlite3
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          import src.main

          assert not any(name.startswith('src.simulator') or name == 'src.api.routes_demo' for name in sys.modules)
          names = {path.name for path in Path('/app/data').iterdir()}
          assert {'app.db', 'security.db'} <= names, names
          assert not any('demo' in name or 'simulator' in name for name in names), names
          with sqlite3.connect('/app/data/app.db') as db:
              assert db.execute('SELECT version_num FROM alembic_version').fetchone()
              assert db.execute('SELECT count(*) FROM campaigns').fetchone()[0] == 0
          base = 'http://127.0.0.1:8000'
          for path in ('/login', '/openapi.json', '/api/auth/session'):
              body = urllib.request.urlopen(base + path).read().decode()
              assert all(word not in body.lower() for word in ('demo', 'демо', 'симулятор')), path
          for path in ('/demo/editor', '/demo/creator', '/demo/simulator', '/api/demo/campaigns'):
              try:
                  urllib.request.urlopen(base + path)
              except urllib.error.HTTPError as error:
                  assert error.code == 404, (path, error.code)
              else:
                  raise AssertionError(path)
          print('Keitaro-only container startup verified')
          PY
