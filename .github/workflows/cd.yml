name: CD Staging Deployment

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  gate-check:
    name: Verify CI Gate Passed
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Confirm CI success
        run: |
          echo "CI gate verified: commit is green and eligible for staging deployment."

      - name: Verify CI passed on manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying CI check-runs for commit ${{ github.sha }}..."
          STATUS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs[] | select(.name=="test-and-lint") | .conclusion' || echo "unknown")
          if [ "$STATUS" != "success" ]; then
            echo "CI status for commit ${{ github.sha }} is '${STATUS}'. Manual deployment requires a passing CI run."
            exit 1
          fi
          echo "CI verified green for commit ${{ github.sha }}."

  publish-image:
    name: Build & Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [gate-check]
    outputs:
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_digest: ${{ steps.build_push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Name and Tag
        id: image_info
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_NAME}:${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "target_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push image to GHCR
        id: build_push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_info.outputs.image_tag }}
            ${{ steps.image_info.outputs.image_name }}:latest

      - name: Record Build Digest
        run: |
          echo "Published image digest: ${{ steps.build_push.outputs.digest }}"
          echo "Target tag: ${{ steps.image_info.outputs.image_tag }}"

  deploy-staging:
    name: Deploy to Staging Target
    runs-on: ubuntu-latest
    needs: [publish-image]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Staging Environment
        env:
          TARGET_IMAGE: ${{ needs.publish-image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "============================================="
          echo "Deploying Staging Image: ${TARGET_IMAGE}"
          echo "Digest: ${IMAGE_DIGEST}"
          echo "============================================="

          if [ -n "$STAGING_HOST" ]; then
            echo "Deploying to remote staging host: $STAGING_HOST"
            # Remote staging deployment commands here (SSH/webhook)
          else
            echo "No remote STAGING_HOST secret configured."
            echo "Staging deployment target status: PENDING user staging environment setup."
            echo "Image is published and ready for deployment: ${TARGET_IMAGE} (${IMAGE_DIGEST})"
          fi
